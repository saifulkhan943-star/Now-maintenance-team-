/* ===== Keyboard-style dashboard (added) ===== */
.kbcards,.kbgrid{padding:14px;border-radius:16px;background:linear-gradient(180deg,#0a1824,#06111b);border:2px solid #1d3d52;box-shadow:inset 0 3px 12px rgba(0,0,0,.65),0 2px 0 #1d3d52}
.kbcards{gap:14px;margin-bottom:16px}
.kbgrid{gap:12px;grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
.kbcards .stat,.kbgrid button.secondary{background:linear-gradient(180deg,#456b82 0%,#2a4c61 55%,#234154 100%);border:1px solid #6f9bb4;border-bottom-color:#17303f;border-radius:11px;box-shadow:0 6px 0 #0f2431,0 10px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 4px rgba(0,0,0,.25);color:var(--text);transition:transform .08s,box-shadow .08s}
.kbcards .stat{text-align:center;padding:14px 10px 16px}
.kbcards .stat small{display:block;color:#cfe8f5;font-weight:700;font-size:12px}
.kbcards .stat strong{font-size:30px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);margin-top:6px}
.kbgrid button.secondary{min-height:62px;padding:10px 8px;font-size:13px;line-height:1.3;white-space:normal;text-align:center}
.kbgrid button.secondary:hover{filter:brightness(1.12)}
.kbgrid button.secondary:active{transform:translateY(5px);box-shadow:0 1px 0 #0f2431,0 3px 6px rgba(0,0,0,.5),inset 0 2px 5px rgba(0,0,0,.35)}
.kbcards .stat.pend{background:linear-gradient(180deg,#ff7d83 0%,#e5414b 55%,#c5303a 100%);border-color:#ffb0b4;border-bottom-color:#7a1019;box-shadow:0 6px 0 #6e0f18,0 10px 18px rgba(255,60,70,.45),inset 0 1px 0 rgba(255,255,255,.4);animation:pendglow 1.6s ease-in-out infinite}
.kbcards .stat.pend small,.kbcards .stat.pend strong{color:#fff}
@keyframes pendglow{50%{filter:brightness(1.18)}}
@media(prefers-reduced-motion:reduce){.kbcards .stat.pend{animation:none}}
.recentwork tr[data-status="Pending"] td{color:var(--red);font-weight:700;background:rgba(255,107,114,.10)}

/* ===== Green digital keys, light up on touch (added) ===== */
.kbcards .stat:not(.pend),.kbgrid button.secondary{background:linear-gradient(180deg,#1f7a52 0%,#145c3c 55%,#0f4a31 100%);border:1px solid #4fe0a0;border-bottom-color:#08301f;box-shadow:0 6px 0 #062a1b,0 10px 14px rgba(0,0,0,.5),0 0 10px rgba(52,198,160,.35),inset 0 1px 0 rgba(180,255,220,.35),inset 0 -2px 4px rgba(0,0,0,.3);color:#d8ffee;font-family:"Courier New",Consolas,monospace;font-weight:700;text-shadow:0 0 6px rgba(80,255,170,.7);-webkit-tap-highlight-color:transparent}
.kbcards .stat:not(.pend) small{color:#9bf0c8}
.kbcards .stat:not(.pend) strong{color:#eafff5;text-shadow:0 0 10px rgba(80,255,170,.9)}
@media(hover:hover){.kbgrid button.secondary:hover{background:linear-gradient(180deg,#7ae8ff 0%,#2fb6e8 55%,#1c8fc0 100%);border-color:#c5f4ff;color:#02202e;text-shadow:none;filter:none}}
.kbgrid button.secondary.lit,.kbcards .stat:not(.pend).lit,.kbcards .stat:not(.pend):active{background:linear-gradient(180deg,#7ae8ff 0%,#2fb6e8 55%,#1c8fc0 100%);border-color:#c5f4ff;color:#02202e;text-shadow:none;box-shadow:0 6px 0 #0d5f7c,0 0 24px rgba(120,230,255,.9),inset 0 1px 0 rgba(255,255,255,.6)}
.kbcards .stat:not(.pend).lit small,.kbcards .stat:not(.pend).lit strong,.kbcards .stat:not(.pend):active small,.kbcards .stat:not(.pend):active strong{color:#02202e;text-shadow:none}
.kbgrid button.secondary.lit:active{box-shadow:0 1px 0 #0d5f7c,0 0 24px rgba(120,230,255,.9),inset 0 2px 5px rgba(0,0,0,.25)}

  if(edit)for(const m of edit.materials||[])rest[m.itemId]=(rest[m.itemId]||0)+num(m.quantity);
  for(const m of materials)add[m.itemId]=(add[m.itemId]||0)+m.quantity;
  for(const id of new Set([...Object.keys(add),...Object.keys(rest)])){const item=inv[id],a=add[id]||0,r=rest[id]||0;
   if(!item){if(a>0)throw new Error("A selected store item was not found.");continue;}
   const avail=Math.round((num(item.opening)+num(item.received)-num(item.used)+r)*1000)/1000;
   if(a>avail)throw new Error(`Insufficient stock for ${item.name}. Available ${avail}.`);
   ups[`inventory/${id}/used`]=Math.max(0,Math.round((num(item.used)-r+a)*1000)/1000);ups[`inventory/${id}/updatedAt`]=now;}
  const key=edit?edit._id:push(ref(state.db,"alManzil/dailyWork")).key;d.createdAt=edit?.createdAt||now;d.updatedAt=now;ups[`dailyWork/${key}`]=d;
  await update(ref(state.db,"alManzil"),ups);state.editId=null;await refreshData();go("dailyWork");
 }catch(err){alert("Work was not saved: "+err.message+" Please check stock and try again.");await refreshData();}}
async function refreshData(){await loadAll();render();}
function inventoryPage(){
 const items=all("inventory");
 const edit=state.editId?items.find(x=>x._id===state.editId):null;
 const rows=items.map(x=>({...x,currentStock:stockOf(x),stockValue:stockOf(x)*num(x.unitPrice)}));
 $("view").innerHTML=`<div class="panel">
 <div class="section-title"><h2>Store Master File — Add / Edit Inventory Items</h2><div class="actions"><button class="secondary" onclick="printHistory('inventory')">PRINT STOCK</button></div></div>
 <p class="muted small">Use this form to add new materials. Items added here also appear in the Daily Work material list.</p>
 <form id="inventoryForm"><div class="gridform">
 <div class="field"><label>Item Name *</label><input name="name" value="${esc(edit?.name||"")}" required placeholder="e.g. Insulation Tape"></div>
 <div class="field"><label>Category *</label><select name="category" required>${["Electrical","Plumbing","AC","Printing","Others"].map(x=>`<option ${edit?.category===x?"selected":""}>${x}</option>`).join("")}</select></div>
 <div class="field"><label>Unit</label><select name="unit">${["pcs","box","roll","meter","litre","kg","set","unit"].map(x=>`<option ${edit?.unit===x?"selected":""}>${x}</option>`).join("")}</select></div>
 <div class="field"><label>Opening Stock</label><input name="opening" type="number" step="any" min="0" value="${esc(edit?.opening??0)}"></div>
 <div class="field"><label>Received Qty</label><input name="received" type="number" step="any" min="0" value="${esc(edit?.received??0)}"></div>
 <div class="field"><label>Used Qty</label><input name="used" type="number" step="any" min="0" value="${esc(edit?.used??0)}"></div>
 <div class="field"><label>Minimum Stock (Needed alert)</label><input name="minStock" type="number" step="any" min="0" value="${esc(edit?.minStock??0)}"></div>
 <div class="field"><label>Unit Price (BD)</label><input name="unitPrice" type="number" step="any" min="0" value="${esc(edit?.unitPrice??0)}"></div>
 <div class="field"><label>Supplier / Shop</label><input name="supplier" value="${esc(edit?.supplier||"")}"></div>
 <div class="field"><label>Remarks</label><input name="remarks" value="${esc(edit?.remarks||"")}"></div>
 </div><div class="actions"><button type="submit">${edit?"Update Inventory Item":"＋ Add New Inventory Item"}</button><button type="button" class="secondary" onclick="cancelEdit()">Clear Form</button><button type="button" class="secondary" onclick="printHistory('inventory')">PRINT STOCK / PDF</button></div></form>
 </div>
 <div class="panel" style="margin-top:14px"><div class="section-title"><h2>Current Store Stock</h2><span class="muted small">${items.length} master items</span></div>
 <div class="gridform no-print"><div class="field"><label>Search Item</label><input id="stockSearch" placeholder="Search..." oninput="filterStock()"></div><div class="field"><label>Category</label><select id="stockCat" onchange="filterStock()"><option value="">All Categories</option>${["Electrical","Plumbing","AC","Printing","Others"].map(x=>`<option>${x}</option>`).join("")}</select></div></div>
 <div class="cards">${["Electrical","Plumbing","AC","Printing","Others"].map(c=>`<div class="stat"><small>${c}</small><strong>${items.filter(x=>x.category===c).length}</strong></div>`).join("")}</div>
 <div id="stockTable">${stockTable(rows)}</div><div class="actions no-print"><button class="secondary" onclick="go('needed')">Needed Materials</button><button class="secondary" onclick="go('handstock')">Hand Stock Print</button></div></div>`;
 $("inventoryForm").onsubmit=async e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target).entries());
  ["opening","received","used","minStock","unitPrice"].forEach(k=>d[k]=num(d[k]));d.name=String(d.name||"").trim();
  try{
   const duplicate=all("inventory").find(x=>x.name?.trim().toLowerCase()===d.name.trim().toLowerCase()&&x._id!==edit?._id);
   if(duplicate){alert("This item already exists. Edit the existing item or use a different name.");return;}
   await putRecord("inventory",edit?._id||null,d);
   state.editId=null;
   await refreshData();
   go("inventory");
  }catch(err){alert("Inventory save failed: "+err.message);}
 };
}
function stockTable(rows){return `<div class="tablewrap"><table id="stockTbl"><thead><tr><th>Item</th><th>Category</th><th>Opening</th><th>Received</th><th>Used</th><th>Current Hand Stock</th><th>Min Stock</th><th>Unit Price</th><th>Stock Value</th><th class="no-print-col">Actions</th></tr></thead><tbody>${rows.map(x=>`<tr data-search="${esc((x.name+" "+x.category).toLowerCase())}" data-cat="${esc(x.category)}"><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${num(x.opening)}</td><td>${num(x.received)}</td><td>${num(x.used)}</td><td class="${(stockOf(x)<num(x.minStock)||stockOf(x)<=0)?"stocklow":""}">${stockOf(x)}</td><td>${num(x.minStock)}</td><td>${money(x.unitPrice)}</td><td>${money(stockOf(x)*num(x.unitPrice))}</td><td class="no-print-col"><button class="secondary" onclick="editRecord('inventory','${x._id}')">Edit</button> <button class="danger" onclick="deleteRecord('inventory','${x._id}')">Delete</button></td></tr>`).join("")}</tbody></table></div>`;}
window.filterStock=()=>{const s=$("stockSearch").value.toLowerCase(),c=$("stockCat").value;document.querySelectorAll("#stockTbl tbody tr").forEach(r=>r.style.display=r.dataset.search.includes(s)&&(!c||r.dataset.cat===c)?"":"none");};
function usagePage(){const usages=all("dailyWork").flatMap(w=>(w.materials||[]).map(m=>({date:w.date,room:w.room,floor:w.floor,technician:w.technician,work:w.workDetails||w.complaint,item:state.records.inventory?.[m.itemId]?.name||m.itemId,quantity:m.quantity,unitPrice:m.unitPrice,cost:num(m.quantity)*num(m.unitPrice),_id:w._id})));const q=$("usageSearch")?.value?.toLowerCase()||"";const filtered=usages.filter(u=>Object.values(u).join(" ").toLowerCase().includes(q));$("view").innerHTML=`<div class="panel"><div class="section-title"><h2>Material Usage History</h2><button onclick="printHistory('usage')">PRINT USAGE HISTORY</button></div><div class="gridform no-print"><div class="field"><label>Search Item / Room / Technician</label><input id="usageSearch" placeholder="Search..." oninput="goUsageSearch()" value="${esc(q)}"></div><div class="field"><label>Month</label><input id="usageMonth" type="month" onchange="filterUsageMonth()"></div></div>${usageTable(filtered)}<h3 style="margin-top:18px">Item & Room-wise Usage Count</h3>${usageSummary(usages)}</div>`;}
function usageTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Floor / Room</th><th>Item</th><th>Quantity</th><th>Unit Price</th><th>Cost</th><th>Technician</th><th>Work</th></tr></thead><tbody>${rows.map(x=>`<tr data-month="${esc(dateKey(x.date))}"><td>${esc(x.date)}</td><td>${esc(x.floor)} / ${esc(x.room)}</td><td>${esc(x.item)}</td><td>${num(x.quantity)}</td><td>${money(x.unitPrice)}</td><td>${money(x.cost)}</td><td>${esc(x.technician)}</td><td>${esc(x.work)}</td></tr>`).join("")||`<tr><td colspan="8" class="empty">No material usage recorded.</td></tr>`}</tbody></table></div>`;}
function usageSummary(rows){const sums={};rows.forEach(x=>{const k=x.item+"|"+x.room;sums[k]=sums[k]??{item:x.item,room:x.room,count:0,qty:0,cost:0};sums[k].count++;sums[k].qty+=num(x.quantity);sums[k].cost+=num(x.cost);});return `<div class="tablewrap"><table><thead><tr><th>Item</th><th>Room</th><th>Times Used</th><th>Total Quantity</th><th>Total Cost</th></tr></thead><tbody>${Object.values(sums).map(x=>`<tr><td>${esc(x.item)}</td><td>${esc(x.room)}</td><td>${x.count}</td><td>${x.qty}</td><td>${money(x.cost)}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">No usage data.</td></tr>`}</tbody></table></div>`;}
window.goUsageSearch=()=>{const q=$("usageSearch").value.toLowerCase();const rows=all("dailyWork").flatMap(w=>(w.materials||[]).map(m=>({date:w.date,room:w.room,floor:w.floor,technician:w.technician,work:w.workDetails||w.complaint,item:state.records.inventory?.[m.itemId]?.name||m.itemId,quantity:m.quantity,unitPrice:m.unitPrice,cost:num(m.quantity)*num(m.unitPrice)}))).filter(u=>Object.values(u).join(" ").toLowerCase().includes(q));const el=document.querySelector("#view .panel");const tables=el.querySelectorAll(".tablewrap");if(tables[0])tables[0].outerHTML=usageTable(rows);filterUsageMonth();};
window.filterUsageMonth=()=>{const m=$("usageMonth").value;document.querySelectorAll("#view .tablewrap tbody tr[data-month]").forEach(r=>r.style.display=!m||r.dataset.month===m?"":"none");};
function neededPage(){const rows=all("inventory").map(x=>({...x,current:stockOf(x),required:Math.max(0,num(x.minStock)-stockOf(x))})).filter(x=>x.required>0||x.current<=0);$("view").innerHTML=`<div class="panel"><div class="section-title"><h2>Needed Materials — Purchase List</h2><button onclick="printHistory('needed')">PRINT NEEDED MATERIALS</button></div><p class="muted small">Required Quantity = Minimum Stock − Current Stock (minimum zero).</p><div class="tablewrap"><table><thead><tr><th>Item</th><th>Category</th><th>Current Stock</th><th>Minimum Stock</th><th>Required Qty</th><th>Estimated Cost</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td class="stocklow">${x.current}</td><td>${num(x.minStock)}</td><td>${x.required}</td><td>${money(x.required*num(x.unitPrice))}</td><td class="stocklow">${x.current<=0?"OUT OF STOCK":"NEED TO BUY"}</td></tr>`).join("")||`<tr><td colspan="7" class="empty">No items below minimum stock.</td></tr>`}</tbody></table></div><div class="actions"><button class="secondary" onclick="go('purchases')">Add Purchase / Receive</button><button class="secondary" onclick="go('inventory')">Current Store Stock</button></div></div>`;}
function handstockPage(){const rows=all("inventory");$("view").innerHTML=`<div class="panel"><div class="section-title"><h2>Hand Stock — Physical Stock Checking Sheet</h2><button onclick="printHistory('handstock')">PRINT HAND STOCK / PDF</button></div><p class="muted">Print this list and write the physical quantity by hand. Handwritten figures do not change database stock automatically.</p><div class="print-head"><h2>AL MANZIL HOTEL BAHRAIN</h2><h3>MAINTENANCE DEPARTMENT — HAND STOCK REPORT</h3><p>Prepared by: ${esc(state.settings.name)} • Date: ${today()}</p></div><div class="tablewrap"><table><thead><tr><th>SL</th><th>Item Name</th><th>Category</th><th>System Stock</th><th>Physical Stock (write)</th><th>Difference</th><th>Remarks</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${stockOf(x)} ${esc(x.unit||"")}</td><td style="min-width:100px;height:28px"></td><td></td><td></td></tr>`).join("")||`<tr><td colspan="7" class="empty">No store items. Add items in Settings.</td></tr>`}</tbody></table></div><div style="display:flex;gap:40px;margin-top:30px"><div>Prepared By: __________________</div><div>Checked By: __________________</div><div>Signature: __________________</div></div></div>`;}
function reportsPage(){const work=all("dailyWork"),items=all("inventory"),projects=all("projects"),roomMap={};work.forEach(w=>{const k=(w.floor||"")+"/"+(w.room||"Unknown");roomMap[k]=roomMap[k]??{floor:w.floor,room:w.room,count:0,cost:0};roomMap[k].count++;roomMap[k].cost+=num(w.materialCost)+num(w.otherCost);});const itemMap={};work.forEach(w=>(w.materials||[]).forEach(m=>{const name=state.records.inventory?.[m.itemId]?.name||m.itemId;itemMap[name]=itemMap[name]??{name,count:0,qty:0,cost:0};itemMap[name].count++;itemMap[name].qty+=num(m.quantity);itemMap[name].cost+=num(m.quantity)*num(m.unitPrice);}));$("view").innerHTML=`<div class="panel"><div class="section-title"><h2>Reports & History Centre</h2><button onclick="window.print()">PRINT REPORT / PDF</button></div><h3>Room-wise Recorded Expense</h3><p class="muted small">Calculated from saved Daily Work records. Material cost is based on the material lines attached to each work record.</p><div class="tablewrap"><table><thead><tr><th>Floor</th><th>Room</th><th>Work Count</th><th>Material + Other Cost</th></tr></thead><tbody>${Object.values(roomMap).map(x=>`<tr><td>${esc(x.floor)}</td><td>${esc(x.room)}</td><td>${x.count}</td><td>${money(x.cost)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No room work records.</td></tr>`}</tbody></table></div><h3 style="margin-top:18px">Item-wise Usage</h3><div class="tablewrap"><table><thead><tr><th>Item</th><th>Times Used</th><th>Total Qty</th><th>Total Cost</th></tr></thead><tbody>${Object.values(itemMap).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.count}</td><td>${x.qty}</td><td>${money(x.cost)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No usage records.</td></tr>`}</tbody></table></div><h3 style="margin-top:18px">Year / Month</h3><div class="gridform no-print"><div class="field"><label>Year</label><input type="number" id="reportYear" value="${today().slice(0,4)}"></div><div class="field"><label>Month</label><input type="month" id="reportMonth" value="${today().slice(0,7)}"></div><button onclick="reportFilter()">Filter Daily Work</button></div><div id="filteredReport"></div></div>`;}
window.reportFilter=()=>{const year=$("reportYear").value,month=$("reportMonth").value;const rows=all("dailyWork").filter(w=>(!year||String(w.date||"").startsWith(year))&&(!month||dateKey(w.date)===month));$("filteredReport").innerHTML=`<h3>Filtered Daily Work: ${rows.length} records</h3>${tableHTML("reportFiltered",rows)}`;};
function themePanelHTML(){const t=state.theme,f=(k,l)=>`<div class="field"><label>${l}</label><input type="color" data-theme="${k}" value="${t[k]}" style="height:46px;padding:3px"></div>`;
 return `<div class="panel" style="margin-top:14px"><h2>Dashboard Colors</h2><p class="muted small">Pick your own colors. They change instantly — press Save Colors to keep them.</p><div class="gridform">${f("key","Key color")}${f("lit","Touched key color")}${f("pend","Pending color")}${f("base","Keyboard base color")}</div><h3 style="margin-top:14px">Quick styles</h3><div class="actions">${THEMES.map((p,i)=>`<button type="button" class="secondary" onclick="themePreset(${i})"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${p.key};margin-right:6px;vertical-align:middle"></span>${p.name}</button>`).join("")}</div><div class="actions"><button type="button" class="good" onclick="themeSave()">Save Colors</button><button type="button" class="secondary" onclick="themePreset(0)">Reset to default</button></div><div id="themeMsg" class="small muted"></div></div>`;}
function bindTheme(){document.querySelectorAll("[data-theme]").forEach(i=>{i.oninput=()=>{state.theme[i.dataset.theme]=i.value;applyTheme(state.theme);};});}
window.themePreset=i=>{const p=THEMES[i];state.theme={key:p.key,lit:p.lit,pend:p.pend,base:p.base};applyTheme(state.theme);document.querySelectorAll("[data-theme]").forEach(x=>{x.value=state.theme[x.dataset.theme];});};
window.themeSave=async()=>{const m=$("themeMsg");try{localStorage.setItem("alManzilTheme",JSON.stringify(state.theme));}catch(e){}try{await set(ref(state.db,"alManzil/theme"),state.theme);m.textContent="Colors saved.";}catch(e){m.textContent="Saved on this device only ("+e.message+")";}};
function settingsPage(){const technicians=all("technicians"),rooms=all("rooms"),items=all("inventory");$("view").innerHTML=`<div class="panel"><h2>Settings</h2><p class="muted">Edit the display name, access code, floors, work types and maintain master lists. Deleting master records does not automatically erase old work history.</p><form id="settingsForm"><div class="gridform"><div class="field"><label>Dashboard / Print Name</label><input name="name" value="${esc(state.settings.name)}" required></div><div class="field"><label>Access Code</label><input name="accessCode" type="password" autocomplete="new-password" value="${esc(state.settings.accessCode)}" required></div><div class="field"><label>Floor Names (one per line)</label><textarea name="floors">${esc((state.settings.floors||[]).join("\n"))}</textarea></div><div class="field"><label>Work Types (one per line)</label><textarea name="workTypes">${esc((state.settings.workTypes||[]).join("\n"))}</textarea></div></div><div class="actions"><button type="submit">Save Settings</button></div></form><div id="settingsMsg"></div></div><div class="panel" style="margin-top:14px"><h2>Master Lists</h2><div class="gridform"><div class="stat"><small>Technicians</small><strong>${technicians.length}</strong><button class="secondary" onclick="go('technicians')">Manage Technicians</button></div><div class="stat"><small>Floors & Rooms</small><strong>${rooms.length}</strong><button class="secondary" onclick="go('rooms')">Manage Floors / Rooms</button></div><div class="stat"><small>Store Items</small><strong>${items.length}</strong><button class="secondary" onclick="go('inventory')">Manage Store Items</button></div></div></div>${themePanelHTML()}<div class="panel" style="margin-top:14px"><h2>Firebase Status</h2><p id="firebaseDetails" class="muted">${state.firebaseOK?"Connected to Realtime Database":"Not connected. Check Firebase configuration and Realtime Database Rules."}</p><p class="small muted">Access code in this single HTML file is only a basic screen lock, not secure authentication. Configure Firebase Authentication and Realtime Database Rules before using real hotel data.</p></div>`;bindTheme();$("settingsForm").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());const clean=t=>t.split("\n").map(x=>x.trim().replace(/\|/g,"/")).filter(Boolean);d.floors=clean(d.floors);d.workTypes=clean(d.workTypes);if(!d.floors.length)d.floors=defaultSettings.floors;if(!d.workTypes.length)d.workTypes=defaultSettings.workTypes;try{await set(ref(state.db,"alManzil/settings"),d);state.settings=d;$("displayName").textContent=d.name;alert("Settings saved.");render();}catch(err){alert("Settings save failed: "+err.message);}};}
window.printHistory=id=>{const titles={usage:"Material Usage History",needed:"Needed Materials List",handstock:"Hand Stock Report",inventory:"Current Store Stock"};document.title=`AL MANZIL HOTEL BAHRAIN - ${titles[id]||DEFINITIONS[id]?.title||id} - ${today()}`;window.print();};
async function start(){try{const app=initializeApp(firebaseConfig);state.db=getDatabase(app);$("connection").textContent="Firebase connecting…";await loadAll();if(!state.firebaseOK)$("loginMsg").textContent="Firebase problem — check internet and Realtime Database Rules.";}catch(e){state.firebaseOK=false;$("connection").textContent="Firebase Error";console.error(e);$("loginMsg").textContent="Firebase connection error: "+e.message+" — Check Settings / Firebase Console.";} }
start();
window.addEventListener("online",()=>{$("connection").textContent=state.firebaseOK?"Firebase Connected":"Internet online";});
window.addEventListener("offline",()=>{$("connection").textContent="Offline — changes will sync when internet returns";});
</script>
</body>
